name: Bashate Linter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bashate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install bashate
        run: |
          python -m pip install --upgrade pip
          pip install bashate

      - name: Run bashate
        run: bashate -i E006,E003 $(find . -name '*.sh')
